services:
  dsh-vm:
    image: ghcr.io/xinlong-wu/ssct-dsh:${DSH_IMAGE_TAG:-latest}
    container_name: dsh-vm
    init: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - '127.0.0.1:${DSH_VM_WEB_PORT:-10240}:10240'
      - '127.0.0.1:${DSH_VM_SSH_PORT:-2222}:2222'
    volumes:
      - vm-disk:/vm/disk
      - ${DSH_CONFIG_HOST:-./config}:/share/config:ro
      - ${DSH_SKILLS_HOST:-./skills}:/share/skills:ro
      # To reuse your own SSH key, also add (and set DSH_VM_SSH_KEY=/keys/id_ed25519):
      #   - $HOME/.ssh/id_ed25519:/keys/id_ed25519:ro
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-}
      # Empty: the entrypoint generates a management keypair into the vm-disk volume.
      DSH_VM_SSH_KEY: ${DSH_VM_SSH_KEY:-}
      DSH_VM_SSH_PORT: ${DSH_VM_SSH_PORT:-2222}
      DSH_VM_WEB_PORT: ${DSH_VM_WEB_PORT:-10240}
      DSH_VM_CPUS: ${DSH_VM_CPUS:-4}
      DSH_VM_MEMORY_MB: ${DSH_VM_MEMORY_MB:-4096}
      DSH_VM_DISK_GB: ${DSH_VM_DISK_GB:-40}
      VM_IMAGE_URL: ${VM_IMAGE_URL:-}
      VM_IMAGE_SHA256: ${VM_IMAGE_SHA256:-}
      FORCE_REPROVISION: ${FORCE_REPROVISION:-0}
    restart: unless-stopped

volumes:
  vm-disk:
